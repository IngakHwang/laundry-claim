{% extends "base.html" %}
{% block title %}클레임 접수 — 세탁 클레임{% endblock %}
{% block body %}
<h1>클레임 접수</h1>
<form class="box" method="post" action="/new" enctype="multipart/form-data">
  <label>거래처</label>
  <select name="client_id" required>
    {% for factory_name, items in clients|groupby('factory_name') %}
    <optgroup label="{{ factory_name }}">
      {% for c in items %}<option value="{{ c.id }}">{{ c.name }} ({{ c.biz_type }}{% if c.rooms %} · {{ c.rooms }}실{% endif %})</option>{% endfor %}
    </optgroup>
    {% endfor %}
  </select>

  <label>유형</label>
  <select name="type">
    {% for code, label in TYPE_LABEL.items() %}<option value="{{ code }}">{{ label }}</option>{% endfor %}
  </select>

  <label>심각도</label>
  <select name="severity">
    <option value="normal">보통</option>
    <option value="urgent">긴급</option>
  </select>

  <label>접수 경로</label>
  <select name="channel">
    <option>전화</option><option>문자</option><option>방문</option>
  </select>

  <label>내용 (들은 그대로)</label>
  <textarea name="content" required placeholder="예: 어제 납품분에 다른 업체 수건이 섞여 왔음"></textarea>

  <label>담당자 배정</label>
  <select name="assignee_id" required>
    {% for factory_name, items in staff|groupby('factory_name') %}
    <optgroup label="{{ factory_name }}">
      {% for s in items %}<option value="{{ s.id }}">[{{ ROLE_LABEL[s.role] }}] {{ s.name }}</option>{% endfor %}
    </optgroup>
    {% endfor %}
  </select>

  <label>사진 (선택, 여러 장 가능) — 폰에서는 바로 촬영됩니다</label>
  <input type="file" name="photos" accept="image/*" capture="environment" multiple>

  <label>담당자에게 지시 (선택)</label>
  <textarea name="instruction" placeholder="예: 오늘 수거 때 회수해 올 것"></textarea>

  <button type="submit">접수하기</button>
</form>
{% endblock %}
